language: node_js
node_js:
- '0.10'
addons:
  chrome: stable
before_script:
- php --version
- google-chrome-stable --version
- php -S localhost:8000 > /tmp/php-server.log 2>&1 &
script:
- npm test
- bash -c 'source ~/.nvm/nvm.sh && nvm install 20 > /dev/null && npm install --prefix /tmp/qunit-runner puppeteer-core@22 > /dev/null && NODE_PATH=/tmp/qunit-runner/node_modules CHROME_BIN=$(command -v google-chrome-stable) node test/run-qunit-headless.js http://localhost:8000/test/index.html'
